name: Build Android libmobileglues
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build arm64-v8a
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          cmake -S MobileGlues-cpp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target mobileglues -j"$(nproc)"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded build/libmobileglues.so
          ls -la build/libmobileglues.so
      - uses: actions/upload-artifact@v4
        with:
          name: libmobileglues-arm64-v8a
          path: build/libmobileglues.so
